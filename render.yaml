# Infraestructura para Render (https://render.com). Un solo `render.yaml`
# levanta base de datos, API y web estática.
databases:
  - name: autosolve-db
    databaseName: autosolve
    user: autosolve
    plan: free

services:
  - type: web
    name: autosolve-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autosolve-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        fromService:
          name: autosolve-web
          type: web
          property: host

  - type: web
    name: autosolve-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace @autosolve/web
    staticPublishPath: ./apps/web/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: autosolve-api
          type: web
          property: host
    routes:
      # Fallback de SPA para React Router.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-cache
