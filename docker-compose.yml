services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autosolve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autosolve}
      POSTGRES_DB: ${POSTGRES_DB:-autosolve}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-autosolve}']
      interval: 5s
      timeout: 3s
      retries: 10
      # La primera vez Postgres crea el cluster y tarda más; sin este margen
      # compose declara el servicio caído y no arranca la API.
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-autosolve}:${POSTGRES_PASSWORD:-autosolve}@db:5432/${POSTGRES_DB:-autosolve}?schema=public
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en el archivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vacío: nginx hace de proxy de /api hacia el servicio api.
        VITE_API_URL: ''
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  pgdata:
