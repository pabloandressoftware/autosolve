name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publicar-imagenes:
    name: Publicar imágenes en GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vercel:
    name: Desplegar en Vercel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # El contexto `secrets` no se puede usar en un `if` de job, así que el
      # token se expone como env y la condición se evalúa a nivel de paso.
      # Sin token el paso se salta y un fork no rompe el pipeline.
      # Alternativa sin secreto: instalar la Vercel GitHub App en la cuenta
      # dueña del repositorio y dejar que Vercel despliegue por su cuenta.
      - name: Desplegar a producción
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

  desplegar:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: publicar-imagenes
    environment: production
    steps:
      # Render escucha un webhook y hace pull de la imagen recién publicada.
      # El deploy solo corre si el secreto está configurado, para que un fork
      # no falle el workflow.
      - name: Disparar el despliegue de la API
        if: ${{ vars.RENDER_API_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ vars.RENDER_API_DEPLOY_HOOK }}"

      - name: Disparar el despliegue de la web
        if: ${{ vars.RENDER_WEB_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ vars.RENDER_WEB_DEPLOY_HOOK }}"

      - name: Sin hooks configurados
        if: ${{ vars.RENDER_API_DEPLOY_HOOK == '' && vars.RENDER_WEB_DEPLOY_HOOK == '' }}
        run: |
          echo "::notice::No hay deploy hooks configurados."
          echo "Las imágenes quedaron publicadas en GHCR y se pueden desplegar a mano."
