name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publicar-imagenes:
    name: Publicar imágenes en GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: publicar-imagenes
    environment: production
    steps:
      # Render escucha un webhook y hace pull de la imagen recién publicada.
      # El deploy solo corre si el secreto está configurado, para que un fork
      # no falle el workflow.
      - name: Disparar el despliegue de la API
        if: ${{ vars.RENDER_API_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ vars.RENDER_API_DEPLOY_HOOK }}"

      - name: Disparar el despliegue de la web
        if: ${{ vars.RENDER_WEB_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ vars.RENDER_WEB_DEPLOY_HOOK }}"

      - name: Sin hooks configurados
        if: ${{ vars.RENDER_API_DEPLOY_HOOK == '' && vars.RENDER_WEB_DEPLOY_HOOK == '' }}
        run: |
          echo "::notice::No hay deploy hooks configurados."
          echo "Las imágenes quedaron publicadas en GHCR y se pueden desplegar a mano."
