server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Los assets llevan hash en el nombre, así que se pueden cachear para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # El service worker y el manifest nunca se cachean: son los que anuncian que
  # hay una versión nueva.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # El seguimiento en vivo va por SSE: sin buffering y sin timeout corto.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Fallback de SPA: cualquier ruta desconocida la resuelve React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
